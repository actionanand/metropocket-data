name: Validate data

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate production sources
        run: python scripts/validate_sources.py
      - name: Build preview artifacts
        run: |
          python scripts/build_all.py             --output dist             --repository "${GITHUB_REPOSITORY}"             --tag ci-preview
      - name: Inspect manifest
        run: cat dist/manifest.json
