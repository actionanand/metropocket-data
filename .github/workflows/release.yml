name: Release data packs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New GitHub release tag, for example v1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate production sources
        run: python scripts/validate_sources.py
      - name: Build release assets
        run: |
          python scripts/build_all.py             --output dist             --repository "${GITHUB_REPOSITORY}"             --tag "${{ inputs.tag }}"             --require-packs
      - name: Show manifest
        run: cat dist/manifest.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test -n "$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; verifying its immutable assets"
            mkdir -p existing-release
            RELEASE_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$RELEASE_ASSETS" | grep -Fxq 'manifest.json'; then
              gh release download "$RELEASE_TAG" --pattern 'manifest.json' --dir existing-release --clobber
              python - dist/manifest.json existing-release/manifest.json <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              candidate = json.load(handle)
          with open(sys.argv[2], encoding="utf-8") as handle:
              published = json.load(handle)
          candidate.pop("generatedAt", None)
          published.pop("generatedAt", None)
          if candidate != published:
              raise SystemExit("ERROR: existing release manifest differs from this build")
          PY
              cp existing-release/manifest.json dist/manifest.json
            else
              gh release upload "$RELEASE_TAG" dist/manifest.json
            fi
            while IFS= read -r asset; do
              if printf '%s\n' "$RELEASE_ASSETS" | grep -Fxq "$asset"; then
                gh release download "$RELEASE_TAG" --pattern "$asset" --dir existing-release --clobber
                cmp -s "dist/$asset" "existing-release/$asset" || {
                  echo "ERROR: existing release asset differs: $asset" >&2
                  exit 1
                }
              else
                gh release upload "$RELEASE_TAG" "dist/$asset"
              fi
            done < <(find dist -maxdepth 1 -name '*.db.gz' -printf '%f\n')
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "MetroPocket Data $RELEASE_TAG" \
              --notes "Versioned offline data packs for MetroPocket."
          fi
      - name: Publish browser client-data mirror
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          set +e
          git ls-remote --exit-code --heads origin client-data >/dev/null
          CLIENT_DATA_REMOTE_STATUS=$?
          set -e
          case "$CLIENT_DATA_REMOTE_STATUS" in
            0) git fetch origin \
                 "+refs/heads/client-data:refs/remotes/origin/client-data" ;;
            2) ;;
            *) echo "ERROR: unable to query origin/client-data" >&2; exit "$CLIENT_DATA_REMOTE_STATUS" ;;
          esac
          if git show-ref --verify --quiet refs/remotes/origin/client-data; then
            if git show-ref --verify --quiet refs/heads/client-data; then
              git merge-base --is-ancestor client-data refs/remotes/origin/client-data || {
                echo "ERROR: local client-data branch diverges from origin/client-data" >&2
                exit 1
              }
            else
              git branch --track client-data refs/remotes/origin/client-data
            fi
            git worktree add ../client-data client-data
            cd ../client-data
            git merge --ff-only refs/remotes/origin/client-data
          else
            if git show-ref --verify --quiet refs/heads/client-data; then
              echo "ERROR: local client-data exists but origin/client-data does not" >&2
              exit 1
            fi
            git worktree add --detach ../client-data
            cd ../client-data
            git switch --orphan client-data
            git rm -r --ignore-unmatch .
            git clean -fdx
          fi

          python ../metropocket-data/scripts/client_mirror.py \
            ../metropocket-data/dist/manifest.json \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --publish-worktree . --assets-dir ../metropocket-data/dist

          git add manifest.json "$RELEASE_TAG"
          if git diff --cached --quiet; then
            echo "client-data is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Publish browser data $RELEASE_TAG"
            git push origin HEAD:client-data
          fi

          echo "==> Waiting for raw client-data mirror"
          for attempt in {1..15}; do
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/client-data/manifest.json" \
              -o /tmp/client-manifest.json || true
            if cmp -s manifest.json /tmp/client-manifest.json; then
              MIRROR_OK=1
              while IFS= read -r asset; do
                curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/client-data/${RELEASE_TAG}/${asset}" \
                  -o "/tmp/${asset}" || { MIRROR_OK=0; break; }
                [[ "$(sha256sum "$asset" | awk '{print $1}')" == "$(sha256sum "/tmp/${asset}" | awk '{print $1}')" ]] || {
                  MIRROR_OK=0; break;
                }
              done < <(find "$RELEASE_TAG" -maxdepth 1 -type f -name '*.db.gz' -printf '%f\n')
              [[ "${MIRROR_OK:-0}" == 1 ]] && break
            fi
            sleep 4
          done
          [[ "${MIRROR_OK:-0}" == 1 ]] || { echo "ERROR: raw client-data mirror did not converge" >&2; exit 1; }
      - name: Verify release archive and client-data mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_release.sh "${{ inputs.tag }}" --verify-only
